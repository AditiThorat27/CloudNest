spring:
  application:
    name: cloudnest-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudnest
    username: root
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
