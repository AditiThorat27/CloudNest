spring:
  application:
    name: cloudnest-backend
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/cloudnest
    username: root
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
